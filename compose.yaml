services:
  provider-fake:
    build: ./provider-fake
    # Só as chaves que o provider simulado aceita; o resto do .env não chega aqui.
    environment:
      FAKE_OPENAI_KEY: ${FAKE_OPENAI_KEY}
      FAKE_ANTHROPIC_KEY: ${FAKE_ANTHROPIC_KEY}
    ports:
      - "8090:8090"

  # Banco do gateway: guarda as chaves virtuais e o gasto de cada uma (ADR 0007).
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm", "-d", "litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: ghcr.io/berriai/litellm:v1.102.1
    # start.sh sobe o LiteLLM e aplica as chaves de keys.yaml, sem passo manual.
    entrypoint: ["/bin/sh", "/gateway/start.sh"]
    environment:
      # As chaves dos providers vivem só aqui.
      FAKE_OPENAI_KEY: ${FAKE_OPENAI_KEY}
      FAKE_ANTHROPIC_KEY: ${FAKE_ANTHROPIC_KEY}
      # Master key (administração e bootstrap) e os valores das virtual keys de keys.yaml.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      HELPDESK_GATEWAY_KEY: ${HELPDESK_GATEWAY_KEY}
      DEMO_BUDGET_KEY: ${DEMO_BUDGET_KEY}
      DEMO_RATE_LIMIT_KEY: ${DEMO_RATE_LIMIT_KEY}
      DATABASE_URL: postgresql://litellm:${GATEWAY_DB_PASSWORD}@gateway-db:5432/litellm
      # Usa a tabela de modelos embutida na imagem, sem buscá-la na internet ao subir.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./gateway:/gateway:ro
    ports:
      - "4000:4000"
    healthcheck:
      # Saudável só depois que as chaves virtuais foram aplicadas.
      test: ["CMD", "python", "-c", "import os, urllib.request; assert os.path.exists('/tmp/keys-ready'); urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      # A primeira subida cria o schema do banco (migrações do Prisma, ~1 a 2,5 min nesta máquina):
      # até 10 min de folga, o mesmo prazo que o bootstrap_keys.py espera (READY_TIMEOUT).
      start_period: 600s
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway-db:
        condition: service_healthy

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ./app
    # Só a URL do gateway e a virtual key do app: as chaves dos providers não chegam à aplicação.
    environment:
      GATEWAY_URL: http://gateway:4000
      GATEWAY_API_KEY: ${HELPDESK_GATEWAY_KEY}
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      gateway:
        condition: service_healthy
