# AI Gateway (LiteLLM Proxy).
#
# A aplicação só conhece os nomes lógicos (`model_name`): uma capacidade por feature. O modelo
# físico, o provider e a credencial de cada capacidade ficam aqui. Trocar o modelo de uma
# capacidade é alterar este arquivo e reiniciar só o serviço `gateway`.

model_list:
  - model_name: ticket-classification        # F1
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY

  - model_name: reply-suggestion             # F2
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY

  - model_name: topics-report                # F3
    litellm_params:
      model: anthropic/claude-fake-large
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY

  - model_name: order-extraction             # F4
    litellm_params:
      model: openai/gpt-fake-large
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
